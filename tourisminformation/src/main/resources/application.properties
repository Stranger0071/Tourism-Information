spring.application.name=tourisminformation
server.port=8081

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}

management.metrics.export.graphite.enabled=${MANAGEMENT_METRICS_EXPORT_GRAPHITE_ENABLED:true}
management.metrics.export.graphite.host=${MANAGEMENT_METRICS_EXPORT_GRAPHITE_HOST:graphite}
management.metrics.export.graphite.port=${MANAGEMENT_METRICS_EXPORT_GRAPHITE_PORT:2003}
management.metrics.export.graphite.step=${MANAGEMENT_METRICS_EXPORT_GRAPHITE_STEP:10s}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

# Database Configuration (H2 In-Memory)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tourismdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# JWT Configuration (Injected via environment variable APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET:9a2f8c7d6e5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
